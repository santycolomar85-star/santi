<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 240 240"
     width="240" height="240"
     role="img"
     aria-label="CIF Ecuanutrition - icono fiscal">
  <title>Ecuanutrition · CIF</title>

  <!--
    Icono CIF v3 BALANCED - peso de linea intermedio para que lea
    bien a 24-32 px en firma de correo (entre v1 grueso 14 y v2
    fino 5; aqui 8 = mismo peso visual que iconos telefono/email/
    web/pin estandar de Outlook).

    Paleta (MANUAL_DE_MARCA_ECUAMAN seccion 2):
      navy:      #1E4670
      cyan ojo:  #7AAFD3
  -->

  <!-- Cuerpo C + cola: trazo 8 -->
  <path d="M 178 52
           Q 145 35, 105 38
           Q 50 45, 38 100
           Q 28 165, 80 195
           Q 130 215, 170 198
           Q 195 188, 200 172
           Q 215 188, 210 215"
        fill="none"
        stroke="#1E4670"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Hoja superior solida -->
  <path d="M 60 70
           Q 105 38, 168 50
           Q 192 56, 198 70
           Q 172 60, 145 60
           Q 100 60, 68 82 Z"
        fill="#1E4670"/>

  <!-- Ojo cian, r=7 -->
  <circle cx="190" cy="58" r="7" fill="#7AAFD3"/>

  <!-- CIF texto, size 58 weight 700 -->
  <text x="120" y="155"
        font-family="Georgia, 'Times New Roman', 'Source Serif Pro', serif"
        font-size="58"
        font-weight="700"
        fill="#1E4670"
        text-anchor="middle"
        letter-spacing="0.5">CIF</text>
</svg>
