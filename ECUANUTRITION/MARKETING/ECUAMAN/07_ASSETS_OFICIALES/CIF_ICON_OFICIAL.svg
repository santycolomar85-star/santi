<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 240 240"
     width="240" height="240"
     role="img"
     aria-label="CIF Ecuanutrition - icono fiscal">
  <title>Ecuanutrition · CIF</title>

  <!--
    Icono CIF en estilo del isotipo oficial Ecuanutrition.
    v2: limpio, sin sombra cian fantasma, C abierta arriba-derecha
    como en el isotipo real, cola integrada al trazo principal.

    Paleta (MANUAL_DE_MARCA_ECUAMAN seccion 2):
      navy principal: #1E4670
      cyan ojo:       #7AAFD3
  -->

  <!-- Cuerpo principal C + cola flourish: un solo trazo continuo
       que arranca en el upper-right (donde nace el ojo), sweeps
       3/4 alrededor del texto, y termina con un pequeno rizo de
       cola en la esquina inferior-derecha (siguiendo el original) -->
  <path d="M 175 48
           Q 140 30, 100 33
           Q 45 38, 33 96
           Q 22 165, 78 198
           Q 130 218, 175 198
           Q 198 188, 205 172
           Q 222 192, 213 222"
        fill="none"
        stroke="#1E4670"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Hoja/onda superior: navy solido, sin sombra interna -->
  <path d="M 55 70
           Q 102 32, 170 48
           Q 195 55, 200 68
           Q 175 60, 148 60
           Q 102 60, 65 85 Z"
        fill="#1E4670"/>

  <!-- Ojo cian arriba-derecha, en el punto donde la hoja
       se cruza con el inicio del cuerpo C -->
  <circle cx="193" cy="58" r="9" fill="#7AAFD3"/>

  <!-- Texto CIF: serif bold, centrado -->
  <text x="120" y="156"
        font-family="Georgia, 'Times New Roman', 'Source Serif Pro', serif"
        font-size="62"
        font-weight="700"
        fill="#1E4670"
        text-anchor="middle"
        letter-spacing="1">CIF</text>
</svg>
