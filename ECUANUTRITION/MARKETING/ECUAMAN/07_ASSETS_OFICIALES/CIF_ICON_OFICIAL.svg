<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 240 240"
     width="240" height="240"
     role="img"
     aria-label="CIF Ecuanutrition - icono fiscal">
  <title>Ecuanutrition · CIF</title>

  <!--
    Icono CIF v3 - linea fina y delicada para usar como bullet
    en firma de correo a 16-32 px. Mismo estilo que la propuesta
    ChatGPT pero con paleta del manual oficial Ecuanutrition.

    Paleta (MANUAL_DE_MARCA_ECUAMAN seccion 2):
      navy:      #1E4670
      cyan ojo:  #7AAFD3
  -->

  <!-- Cuerpo C + cola: trazo continuo fino (stroke 5) -->
  <path d="M 178 52
           Q 145 35, 105 38
           Q 50 45, 38 100
           Q 28 165, 80 195
           Q 130 215, 170 198
           Q 195 188, 200 172
           Q 215 188, 210 215"
        fill="none"
        stroke="#1E4670"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Hoja superior: navy solido, mas delicada -->
  <path d="M 65 70
           Q 110 40, 168 52
           Q 188 58, 192 70
           Q 168 62, 142 62
           Q 102 62, 72 80 Z"
        fill="#1E4670"/>

  <!-- Ojo cian arriba-derecha -->
  <circle cx="190" cy="58" r="6" fill="#7AAFD3"/>

  <!-- CIF: serif bold, centrado, proporcionado al trazo fino -->
  <text x="120" y="153"
        font-family="Georgia, 'Times New Roman', 'Source Serif Pro', serif"
        font-size="54"
        font-weight="700"
        fill="#1E4670"
        text-anchor="middle"
        letter-spacing="0.5">CIF</text>
</svg>
